name: Browser capture check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a node scripts/smoke-extension.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check-screenshots
          path: out/browser-check/*.png
          if-no-files-found: ignore
          retention-days: 14
  native-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run package
      - run: node scripts/smoke-packaged.mjs
      - run: npm run extension:build
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: tastemate-browser-extension
          path: out/extension/*.zip
          if-no-files-found: error
          retention-days: 30

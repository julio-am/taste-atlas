name: Desktop installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            artifact: macos-arm64
          - label: macOS Intel
            runner: macos-15-intel
            artifact: macos-x64
          - label: Windows
            runner: windows-2025
            artifact: windows-x64
          - label: Linux
            runner: ubuntu-24.04
            artifact: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - run: npm ci
      - run: npm test
      - name: Check whether Mac signing is configured
        id: mac_signing
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        shell: bash
        run: |
          if [[ -n "$MACOS_CERTIFICATE_P12_BASE64" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Skipping the signed Mac installer until Developer ID credentials are configured.'
          fi
      - name: Prepare Developer ID signing and notarization
        if: runner.os == 'macOS' && steps.mac_signing.outputs.ready == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/prepare-macos-signing.sh
      - run: npm run make
        if: runner.os != 'macOS' || steps.mac_signing.outputs.ready == 'true'
      - run: node scripts/smoke-packaged.mjs
        if: runner.os != 'macOS' || steps.mac_signing.outputs.ready == 'true'
      - name: Launch packaged Mac window
        if: runner.os == 'macOS' && steps.mac_signing.outputs.ready == 'true'
        run: node scripts/smoke-gui.mjs
      - name: Verify app from the DMG
        if: runner.os == 'macOS' && steps.mac_signing.outputs.ready == 'true'
        run: bash scripts/verify-macos-distribution.sh
      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS' || steps.mac_signing.outputs.ready == 'true'
        with:
          name: tastemate-${{ matrix.artifact }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing credentials
        if: always() && runner.os == 'macOS'
        run: |
          if [[ -f "$RUNNER_TEMP/tastemate-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/tastemate-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/tastemate-developer-id.p12"
